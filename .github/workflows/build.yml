name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build macOS app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Release (ad-hoc signed)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project FolderIcon.xcodeproj \
            -scheme FolderIcon \
            -configuration Release \
            -derivedDataPath build_output \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolderIcon-Release
          path: build_output/Build/Products/Release/FolderIcon.app
          if-no-files-found: error
